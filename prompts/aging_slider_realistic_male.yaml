# Photographic adult male skin-aging slider; positive strength adds age-related skin changes.
# Adapted from aging_slider_fullbody_male.yaml; record order, clothing, pose, framing, and scenes are retained.
# Select this separate preset for realistic MOSS derivatives such as MoodyMoss.
# target == negative == neutral; neutral is an L2 reference, not a preservation loss.
# Requires new training on the selected base; visual quality has not been validated.
# Six records: four full-body views and two waist-up views; no image dataset or region mask.

