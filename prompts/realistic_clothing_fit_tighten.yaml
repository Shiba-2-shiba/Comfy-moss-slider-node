# MOSS-Image realistic clothing fit: positive strength moves toward a close fit.
# Adapted from Confyui-krea2-slider-node/prompts/clothing_fit_tighten_slider_v2.yaml.
# Six records: blouse, cardigan, jacket, sweater, top, dress; original order and fit contrasts retained.
# All roles use photographic style, natural skin texture and realistic fabric detail.
# target == neutral: regular fit; positive/negative describe opposite fit poles.
# positive: close fit; negative: loose fit.
# Only the two clothing-fit sentences differ between roles in each record.
# Garment type/color, adult body, hair, pose, framing, background and lighting are shared within each record.
# Cardigan and jacket fits are described over their underlying tops; complete garment outlines are visible.
# Use native MOSS CLIP (type=moss_image); choose this file via prompt_yaml.
# Use the same base and training settings as your comparison trial, with a distinct output_prefix.
# steps=600 is the total update count: 100 updates per record.
# neutral is an L2 normalization reference, not a preservation loss or region mask.
# negative is a teacher comparison caption, not a generation exclusion list.
# Captions do not configure node settings. Training and generated-image effects are unvalidated.

# 0: blouse; centered front view, head to below hips
- target: &base0 >-
    A photorealistic color studio photograph with natural skin texture and realistic fabric detail shows
    a single adult woman. The blouse has a regular fit with moderate fabric allowance around her torso
    and upper arms. Its side outline leaves a small amount of room at the waist, and the sleeves have
    ordinary width around her arms. She has an average build, medium-width shoulders, a defined waist,
    medium-width hips, and moderately slender arms. Her shoulder-length dark brown hair rests behind her
    shoulders. She wears a plain, opaque, charcoal blouse with a high round neckline and long sleeves,
    and dark straight-leg trousers. She stands upright with relaxed shoulders, a neutral expression, and
    her arms slightly away from her sides, leaving the garment outline unobstructed. A centered front
    view shows her from the top of her head to below her hips, with her face, shoulders, full sleeves,
    waist, and the complete blouse outline clearly visible. A clean, bright studio with a plain pale
    wall and soft, even lighting. She is fully clothed.
  positive: >-
    A photorealistic color studio photograph with natural skin texture and realistic fabric detail shows
    a single adult woman. The blouse fits closely around her torso and upper arms, with very little
    space between the fabric and her body. Its side outline follows her waist, and the sleeves closely
    follow the shape of her arms. She has an average build, medium-width shoulders, a defined waist,
    medium-width hips, and moderately slender arms. Her shoulder-length dark brown hair rests behind her
    shoulders. She wears a plain, opaque, charcoal blouse with a high round neckline and long sleeves,
    and dark straight-leg trousers. She stands upright with relaxed shoulders, a neutral expression, and
    her arms slightly away from her sides, leaving the garment outline unobstructed. A centered front
    view shows her from the top of her head to below her hips, with her face, shoulders, full sleeves,
    waist, and the complete blouse outline clearly visible. A clean, bright studio with a plain pale
    wall and soft, even lighting. She is fully clothed.
  negative: >-
    A photorealistic color studio photograph with natural skin texture and realistic fabric detail shows
    a single adult woman. The blouse has a loose fit with ample space between the fabric and her torso
    and upper arms. Its side outline hangs well away from her waist, and the sleeves are visibly wider
    than her arms. She has an average build, medium-width shoulders, a defined waist, medium-width hips,
    and moderately slender arms. Her shoulder-length dark brown hair rests behind her shoulders. She
    wears a plain, opaque, charcoal blouse with a high round neckline and long sleeves, and dark
    straight-leg trousers. She stands upright with relaxed shoulders, a neutral expression, and her arms
    slightly away from her sides, leaving the garment outline unobstructed. A centered front view shows
    her from the top of her head to below her hips, with her face, shoulders, full sleeves, waist, and
    the complete blouse outline clearly visible. A clean, bright studio with a plain pale wall and soft,
    even lighting. She is fully clothed.
  neutral: *base0

