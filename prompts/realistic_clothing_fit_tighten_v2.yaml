# MOSS-Image realistic clothing fit v2: positive strength moves toward a tight, body-hugging fit.
# Twelve records: six upper garments/dress, four lower garments, two coordinated outfits.
# target == neutral: regular fit; positive: tight fit; negative: loose fit.
# Only the two fit sentences differ within each record. Body, age, fabric, color, length,
# pose, framing, background and light are shared. Skirts retain a continuous skirt silhouette.
# Lower-only records retain the top's regular fit; upper-only records retain the lower garment.
# Captions express preservation intent, not a body/face preservation loss or spatial mask.
# Use native MOSS CLIP (type=moss_image). Train under a new output_prefix.
# 600 total steps = 50 updates per record; 1200 = 100, matching the old six-record exposure.
# These counts are not validated optimal settings. Lower-strength efficacy is unvalidated.

