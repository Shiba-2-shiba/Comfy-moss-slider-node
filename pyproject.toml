[project]
name = "comfy-moss-slider-node"
version = "0.1.0"
description = "Frozen ConvRot INT8 MOSS-Image Slider LoRA training for ComfyUI"
requires-python = ">=3.10"
dependencies = ["torch>=2.9", "safetensors>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff==0.14.4", "mypy==1.18.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: requires an actual CUDA or ROCm device"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".test-deps", ".omx", "test-results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
packages = ["moss_slider_node"]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
